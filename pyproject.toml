[project]
name = "media-ocr"
version = "0.1.0"
description = "Local-first, review-oriented OCR workflow for local media files"
readme = "README.md"
requires-python = ">=3.14,<3.15"

[tool.pytest.ini_options]
testpaths = ["skill/scripts"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 240
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
